version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/sdrangel-mcp
    binary: sdrangel-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/thereisnotime/sdrangel-mcp/internal/version.Version={{.Version}}
      - -X github.com/thereisnotime/sdrangel-mcp/internal/version.Commit={{.Commit}}
      - -X github.com/thereisnotime/sdrangel-mcp/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--yes"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: thereisnotime
    name: sdrangel-mcp
